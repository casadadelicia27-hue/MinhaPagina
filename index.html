
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020502">
  <title>Ksada Delícia | Link Oficial</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      background:
        radial-gradient(ellipse at center, #102600 0%, #030703 52%, #000 100%);
    }

    .pagina {
      width: 100%;
      max-width: 700px;
    }

    .marca {
      color: #91ff00;
      font-family: "Brush Script MT", cursive;
      font-size: clamp(48px, 12vw, 82px);
      font-weight: bold;
      font-style: italic;
      line-height: 1;
      text-shadow: 0 0 12px #67ff00, 0 0 35px #397d00;
      margin-bottom: 50px;
    }

    .naipe {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 45px;
      font-style: normal;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(25px, 5.5vw, 42px);
      line-height: 1.2;
      margin: 0 0 8px;
      font-weight: 900;
    }

    h2 {
      color: #8cff00;
      font-size: clamp(23px, 5vw, 39px);
      line-height: 1.2;
      margin: 0 0 28px;
      font-weight: 900;
    }

    .descricao {
      color: #ccc;
      font-size: clamp(16px, 3.5vw, 21px);
      line-height: 1.6;
      margin: 0 auto 38px;
    }

    .linha {
      display: flex;
      align-items: center;
      gap: 25px;
      margin: 0 0 42px;
      color: #8cff00;
    }

    .linha::before,
    .linha::after {
      content: "";
      flex: 1;
      height: 4px;
      background: #8cff00;
      box-shadow: 0 0 12px #69ff00;
    }

    .ponto {
      font-size: 30px;
    }

    .seta {
      color: #8cff00;
      font-size: 72px;
      line-height: 1;
      margin-bottom: 40px;
      text-shadow: 0 0 15px #69ff00;
    }

    .caixa-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 2px solid #444;
      border-radius: 25px;
      background: rgba(25, 25, 25, 0.88);
      box-shadow: 0 0 18px rgba(80, 255, 0, 0.08);
    }

    .endereco {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: left;
      padding: 8px;
      font-size: clamp(13px, 3.5vw, 20px);
      color: #fff;
    }

    .botao {
      border: none;
      border-radius: 18px;
      background: #f12645;
      color: white;
      font-size: 18px;
      padding: 17px 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    .botao:hover {
      background: #d91535;
      transform: scale(1.03);
    }

    .contador {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
      color: #c8f5a2;
      font-size: 13px;
      margin-top: 14px;
    }

    .olho {
      color: #8cff00;
      font-size: 22px;
    }

    #totalVisitas {
      color: #8cff00;
      font-weight: bold;
    }

    footer {
      margin-top: 85px;
      color: #777;
      letter-spacing: 7px;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      body {
        padding: 30px 14px;
      }

      .marca {
        margin-bottom: 40px;
      }

      .caixa-link {
        border-radius: 18px;
        padding: 8px;
      }

      .botao {
        font-size: 15px;
        padding: 14px 15px;
      }

      footer {
        margin-top: 65px;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <div class="marca">
      <span class="naipe">♠</span>
      Ksada<br>Delícia
    </div>

    <h1>ACESSE PELO NAVEGADOR</h1>
    <h2>COPIANDO O LINK ABAIXO</h2>

    <p class="descricao">
      Toque no botão para copiar o endereço.
      Depois, cole no navegador e acesse o link oficial da Ksada Delícia.
    </p>

    <div class="linha">
      <span class="ponto">●</span>
    </div>

    <div class="seta">↓</div>

    <div class="caixa-link">
      <div class="endereco" id="endereco">
        https://beacons.ai/CasadaDelicia
      </div>

      <button class="botao" id="copiar" type="button">
        Copiar
      </button>
    </div>

    <div class="contador">
      <span class="olho">◉</span>
      <span>VISITANTES:</span>
      <span id="totalVisitas">...</span>
    </div>

    <footer>KSADA DELÍCIA</footer>

  </main>

  <script>
    const botao = document.getElementById("copiar");
    const endereco = "https://beacons.ai/CasadaDelicia";

    botao.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(endereco);
        botao.textContent = "Copiado!";
      } catch (erro) {
        const campo = document.createElement("textarea");
        campo.value = endereco;
        campo.style.position = "fixed";
        campo.style.opacity = "0";
        document.body.appendChild(campo);
        campo.select();

        const copiou = document.execCommand("copy");
        campo.remove();

        botao.textContent = copiou ? "Copiado!" : "Copie o link";
      }

      setTimeout(() => {
        botao.textContent = "Copiar";
      }, 2000);
    });

    function atualizarVisitas(resposta) {
      const campo = document.getElementById("totalVisitas");

      if (resposta && Number.isFinite(Number(resposta.value))) {
        campo.textContent =
          Number(resposta.value).toLocaleString("pt-BR");
      } else {
        campo.textContent = "indisponível";
      }
    }
  </script>

  <script async
    src="https://counterapi.com/api/delicia27-hue.github.io/view/casada-delicia?callback=atualizarVisitas">
  </script>

</body>
</html>
