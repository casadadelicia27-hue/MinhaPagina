
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030503">
  <meta name="description" content="Ksada Delícia — aventuras, novidades e link oficial.">
  <title>Ksada Delícia ♠</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 52% 58%, rgba(40, 105, 0, .20), transparent 50%),
        #020302;
      color: white;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .pagina {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 120px 0 45px;
      text-align: center;
    }

    .logo {
      margin: 0 0 55px;
      color: #80ff00;
      font-family: 'Allura', cursive;
      font-size: clamp(55px, 10vw, 86px);
      line-height: 1.15;
      white-space: nowrap;
      text-shadow:
        0 0 8px rgba(128, 255, 0, .8),
        0 0 24px rgba(128, 255, 0, .45);
    }

    .naipe {
      font-family: Arial, sans-serif;
      font-size: .65em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(25px, 5vw, 40px);
      font-weight: 700;
      line-height: 1.35;
    }

    h2 {
      margin: 0 0 48px;
      color: #80ff00;
      font-size: clamp(21px, 4.5vw, 35px);
      line-height: 1.35;
      font-weight: 700;
    }

    .descricao {
      margin: 0;
      color: #c8c8c8;
      font-size: clamp(17px, 3.8vw, 27px);
      line-height: 1.8;
      font-weight: 300;
    }

    .linha-neon {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 45px;
      margin: 85px 0 105px;
    }

    .linha-neon::before,
    .linha-neon::after {
      content: "";
      height: 6px;
      flex: 1;
      background: #80ff00;
      box-shadow: 0 0 12px #80ff00;
    }

    .linha-neon span {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      border-radius: 50%;
      background: #80ff00;
      box-shadow: 0 0 16px rgba(128, 255, 0, .5);
    }

    .seta {
      margin-bottom: 55px;
      color: #80ff00;
      font-size: 78px;
      line-height: 1;
      text-shadow: 0 0 15px rgba(128, 255, 0, .7);
      animation: mover 1.2s infinite ease-in-out;
    }

    @keyframes mover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(12px); }
    }

    .link-caixa {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border: 3px solid #444;
      border-radius: 30px;
      background: #191919;
      box-shadow: 0 0 10px rgba(128, 255, 0, .05);
    }

    .endereco {
      flex: 1;
      min-width: 0;
      padding: 8px;
      overflow-wrap: anywhere;
      text-align: left;
      color: #f4f4f4;
      font-size: clamp(14px, 3.4vw, 23px);
      line-height: 1.5;
    }

    #copiar {
      flex-shrink: 0;
      padding: 18px 24px;
      border: none;
      border-radius: 24px;
      background: #f52245;
      color: white;
      font-family: inherit;
      font-size: 21px;
      cursor: pointer;
    }

    #copiar:active {
      transform: scale(.97);
    }

    #mensagemCopiado {
      display: none;
      margin-top: 15px;
      color: #80ff00;
      font-size: 17px;
      line-height: 1.5;
    }

    #mensagemCopiado.visivel {
      display: block;
    }

    .contador {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
      margin-top: 25px;
      color: #c8f5a2;
      font-size: 17px;
    }

    .contador-ponto {
      color: #80ff00;
      font-size: 22px;
      text-shadow: 0 0 8px #80ff00;
    }

    /* O serviço insere o número dentro deste espaço */
    .contador-api {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 30px;
      min-height: 30px;
      color: #c8f5a2;
    }

    .rodape {
      margin-top: auto;
      padding-top: 100px;
      color: #777;
      font-size: 18px;
      letter-spacing: 8px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px;
      }

      .pagina {
        padding-top: 145px;
        padding-bottom: 40px;
      }

      .logo {
        margin-bottom: 55px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        margin-bottom: 48px;
        font-size: 23px;
      }

      .linha-neon {
        gap: 45px;
        margin: 85px 0 105px;
      }

      .link-caixa {
        padding: 10px;
        border-radius: 28px;
      }

      .endereco {
        font-size: 15px;
      }

      #copiar {
        padding: 17px 20px;
        font-size: 19px;
      }

      .contador {
        font-size: 16px;
      }

      .rodape {
        padding-top: 100px;
        font-size: 15px;
        letter-spacing: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .seta {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <div class="logo">
      Ksada Delícia<span class="naipe">♠</span>
    </div>

    <h1>ACESSE PELO NAVEGADOR</h1>

    <h2>COPIANDO O LINK ABAIXO</h2>

    <p class="descricao">
      Toque no botão para copiar o endereço. Depois, cole<br class="desktop">
      no navegador e acesse o link oficial da Ksada Delícia.
    </p>

    <div class="linha-neon" aria-hidden="true">
      <span></span>
    </div>

    <div class="seta" aria-hidden="true">↓</div>

    <div class="link-caixa">
      <div class="endereco" id="endereco">
        https://beacons.ai/CasadaDelicia
      </div>

      <button id="copiar" type="button">Copiar</button>
    </div>

    <div id="mensagemCopiado" role="status" aria-live="polite">
      ✓ Link copiado! Agora é só colar no navegador.
    </div>

    <div class="contador">
      <span class="contador-ponto">◉</span>
      <span>VISITANTES:</span>

      <span class="contador-api">
        <span
          class="counterapi"
          ns="casadadelicia27-hue.github.io"
          key="casada-delicia"
          action="view"
          noLink="true"
          noFormatting="true">
        </span>
      </span>
    </div>

    <footer class="rodape">KSADA DELÍCIA</footer>

  </main>

  <!-- Contador de visitantes CounterAPI -->
  <script
    src="https://counterapi.com/c.js?ns=casadadelicia27-hue.github.io"
    async>
  </script>

  <!-- Botão de copiar -->
  <script>
    const botao = document.getElementById("copiar");
    const endereco = "https://beacons.ai/CasadaDelicia";
    const mensagem = document.getElementById("mensagemCopiado");

    botao.addEventListener("click", async function () {
      let copiou = false;

      try {
        await navigator.clipboard.writeText(endereco);
        copiou = true;
      } catch (erro) {
        const campo = document.createElement("textarea");
        campo.value = endereco;
        campo.style.position = "fixed";
        campo.style.left = "-9999px";

        document.body.appendChild(campo);
        campo.focus();
        campo.select();

        try {
          copiou = document.execCommand("copy");
        } catch (erroCopia) {
          copiou = false;
        }

        campo.remove();
      }

      if (copiou) {
        botao.textContent = "Copiado!";
        mensagem.classList.add("visivel");
      } else {
        botao.textContent = "Tente novamente";
        mensagem.classList.remove("visivel");
      }

      setTimeout(function () {
        botao.textContent = "Copiar";
      }, 2500);
    });
  </script>
</body>
</html>
