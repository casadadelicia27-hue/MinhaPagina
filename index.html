<script>
const botao = document.getElementById("copiar");
const endereco = "https://beacons.ai/CasadaDelicia";
const mensagem = document.getElementById("mensagemCopiado");

botao.addEventListener("click", async () => {
  let copiou = false;

  try {
    await navigator.clipboard.writeText(endereco);
    copiou = true;
  } catch (erro) {
    const campo = document.createElement("textarea");
    campo.value = endereco;
    campo.style.position = "fixed";
    campo.style.opacity = "0";
    document.body.appendChild(campo);
    campo.select();

    try {
      copiou = document.execCommand("copy");
    } catch (e) {
      copiou = false;
    }

    campo.remove();
  }

  if (copiou) {
    botao.textContent = "Copiado!";
    mensagem.classList.add("visivel");
  } else {
    botao.textContent = "Tente novamente";
    mensagem.classList.remove("visivel");
  }

  setTimeout(() => {
    botao.textContent = "Copiar";
  }, 2000);
});

/* ===== CONTADOR DE VISITAS (corrigido) ===== */
(function() {
  const campo = document.getElementById("totalVisitas");
  const NAMESPACE = "ksada-delicia";
  const KEY = "visitas";

  // Incrementa e mostra o total
  fetch(`https://api.countapi.xyz/hit/\( {NAMESPACE}/ \){KEY}`)
    .then(r => r.json())
    .then(data => {
      if (data && Number.isFinite(data.value)) {
        campo.textContent = Number(data.value).toLocaleString("pt-BR");
      } else {
        campo.textContent = "indisponível";
      }
    })
    .catch(() => {
      // Fallback: tenta só ler o valor atual
      fetch(`https://api.countapi.xyz/get/\( {NAMESPACE}/ \){KEY}`)
        .then(r => r.json())
        .then(data => {
          if (data && Number.isFinite(data.value)) {
            campo.textContent = Number(data.value).toLocaleString("pt-BR");
          } else {
            campo.textContent = "indisponível";
          }
        })
        .catch(() => {
          campo.textContent = "indisponível";
        });
    });
})();
</script>
