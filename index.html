
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030503">
<title>Ksada Delícia ♠</title>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #020302;
}

body {
  margin: 0;
  min-height: 100svh;
  padding: 12px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at center, rgba(38,100,0,.18), transparent 65%),
    #020302;
  color: white;
  font-family: 'Roboto', Arial, sans-serif;
}

.pagina {
  width: 100%;
  max-width: 480px;
  min-height: min(760px, calc(100svh - 24px));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px 0 12px;
}

.logo {
  margin: 0 0 20px;
  color: #80ff00;
  font-family: 'Allura', cursive;
  font-size: clamp(43px, 10vw, 64px);
  line-height: 1.05;
  white-space: nowrap;
  text-shadow: 0 0 10px #63bd00, 0 0 22px rgba(128,255,0,.4);
}

.naipe {
  font-family: Arial, sans-serif;
  font-size: .65em;
}

h1 {
  margin: 0 0 7px;
  font-size: clamp(20px, 5.3vw, 28px);
  line-height: 1.2;
  font-weight: 700;
}

h2 {
  margin: 0 0 20px;
  color: #80ff00;
  font-size: clamp(17px, 4.6vw, 25px);
  line-height: 1.25;
}

.descricao {
  margin: 0;
  color: #c8c8c8;
  font-size: clamp(14px, 3.8vw, 18px);
  line-height: 1.5;
  font-weight: 300;
}

.linha-neon {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 22px;
  margin: 28px 0 24px;
}

.linha-neon::before,
.linha-neon::after {
  content: "";
  height: 4px;
  flex: 1;
  background: #80ff00;
  box-shadow: 0 0 10px #80ff00;
}

.linha-neon span {
  width: 13px;
  height: 13px;
  flex: 0 0 13px;
  border-radius: 50%;
  background: #80ff00;
  box-shadow: 0 0 12px rgba(128,255,0,.6);
}

.seta {
  margin: 0 0 22px;
  color: #80ff00;
  font-size: 53px;
  line-height: 1;
  text-shadow: 0 0 12px rgba(128,255,0,.6);
  animation: mover 1.2s infinite ease-in-out;
}

@keyframes mover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

.link-caixa {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px;
  border: 2px solid #444;
  border-radius: 22px;
  background: #191919;
}

.endereco {
  flex: 1;
  min-width: 0;
  padding: 7px 6px;
  text-align: center;
  color: #f4f4f4;
  font-size: clamp(11px, 3.1vw, 15px);
  line-height: 1.3;
  overflow-wrap: anywhere;
  word-break: normal;
}

#copiar {
  flex-shrink: 0;
  padding: 13px 17px;
  border: none;
  border-radius: 18px;
  background: #f52245;
  color: white;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
}

#mensagemCopiado {
  display: none;
  margin-top: 9px;
  color: #80ff00;
  font-size: 13px;
  line-height: 1.4;
}

#mensagemCopiado.visivel {
  display: block;
}

.contador {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  color: #c8f5a2;
  font-size: 13px;
}

.contador-ponto {
  color: #80ff00;
}

.contador-api {
  min-width: 20px;
  min-height: 20px;
  display: inline-flex;
  align-items: center;
  color: #c8f5a2;
}

.rodape {
  margin-top: auto;
  padding-top: 20px;
  color: #777;
  font-size: 11px;
  letter-spacing: 5px;
}

@media (max-height: 700px) {
  .pagina {
    min-height: calc(100svh - 24px);
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .logo {
    font-size: clamp(39px, 9vw, 52px);
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(19px, 5vw, 25px);
  }

  h2 {
    margin-bottom: 13px;
    font-size: clamp(16px, 4.3vw, 22px);
  }

  .linha-neon {
    margin: 18px 0;
  }

  .seta {
    font-size: 43px;
    margin-bottom: 16px;
  }

  .rodape {
    padding-top: 12px;
  }
}

@media (max-width: 360px) {
  body {
    padding-left: 12px;
    padding-right: 12px;
  }

  .logo {
    font-size: 42px;
  }

  .endereco {
    font-size: 11px;
  }

  #copiar {
    padding: 12px 13px;
    font-size: 14px;
  }

  .linha-neon {
    gap: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .seta {
    animation: none;
  }
}
</style>
</head>

<body>
<main class="pagina">

  <div class="logo">
    Ksada Delícia<span class="naipe">♠</span>
  </div>

  <h1>ACESSE PELO NAVEGADOR</h1>
  <h2>COPIANDO O LINK ABAIXO</h2>

  <p class="descricao">
    Toque no botão para copiar o endereço. Depois, cole no navegador e acesse o link oficial da Ksada Delícia.
  </p>

  <div class="linha-neon" aria-hidden="true">
    <span></span>
  </div>

  <div class="seta" aria-hidden="true">↓</div>

  <div class="link-caixa">
    <div class="endereco" id="endereco">
      https://beacons.ai/CasadaDelicia
    </div>
    <button id="copiar" type="button">Copiar</button>
  </div>

  <div id="mensagemCopiado" role="status" aria-live="polite">
    ✓ Link copiado! Agora é só colar no navegador.
  </div>

  <div class="contador">
    <span class="contador-ponto">◉</span>
    <span>VISITANTES:</span>
    <span class="contador-api">
      <span
        class="counterapi"
        ns="casadadelicia27-hue.github.io"
        key="casada-delicia"
        action="view"
        noLink="true"
        noFormatting="true">
      </span>
    </span>
  </div>

  <footer class="rodape">KSADA DELÍCIA</footer>

</main>

<!-- Contador de visitantes -->
<script
  src="https://counterapi.com/c.js?ns=casadadelicia27-hue.github.io"
  async>
</script>

<!-- Botão para copiar o link -->
<script>
const botao = document.getElementById("copiar");
const endereco = "https://beacons.ai/CasadaDelicia";
const mensagem = document.getElementById("mensagemCopiado");

botao.addEventListener("click", async function () {
  let copiou = false;

  try {
    await navigator.clipboard.writeText(endereco);
    copiou = true;
  } catch (erro) {
    const campo = document.createElement("textarea");
    campo.value = endereco;
    campo.style.position = "fixed";
    campo.style.left = "-9999px";
    document.body.appendChild(campo);
    campo.select();

    try {
      copiou = document.execCommand("copy");
    } catch (erroCopia) {
      copiou = false;
    }

    campo.remove();
  }

  if (copiou) {
    botao.textContent = "Copiado!";
    mensagem.classList.add("visivel");
  } else {
    botao.textContent = "Tente novamente";
    mensagem.classList.remove("visivel");
  }

  setTimeout(function () {
    botao.textContent = "Copiar";
  }, 2200);
});
</script>
</body>
  </html>
